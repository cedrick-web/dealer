name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Audit frontend dependency tree
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
      - name: Build production client
        working-directory: frontend
        run: npm run build

  backend:
    name: Dart analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve packages
        working-directory: backend
        run: dart pub get
      - name: Analyze API
        working-directory: backend
        run: dart analyze
      - name: Run Dart unit tests
        working-directory: backend
        run: dart test

  route-contract:
    name: API route contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check for duplicate or missing routes
        run: python scripts/check_api_routes.py


  container-build:
    name: Docker image and Compose smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGO_ROOT_USERNAME: dealer_ci
      MONGO_ROOT_PASSWORD: dealer_ci_alphanumeric_password_123
      MONGO_DATABASE: dealer_ci
      JWT_SECRET: ci_only_secret_that_is_long_enough_for_hmac_signing_and_never_used_outside_this_job
      WEB_ORIGIN: http://localhost:5173,dealer://app
      VITE_API_URL: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config -q
      - name: Build API image
        run: docker build --tag dealer-api:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://localhost:8080 --tag dealer-web:ci ./frontend

  desktop-shell:
    name: Desktop shell syntax and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Electron main process syntax
        run: node --check desktop/main.cjs
      - name: Validate desktop package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('desktop/package.json', 'utf8')); console.log('Desktop package manifest is valid JSON')"

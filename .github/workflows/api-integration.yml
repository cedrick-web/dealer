name: Marketplace API integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-workflows:
    name: MongoDB-backed marketplace workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGO_ROOT_USERNAME: dealer_ci
      MONGO_ROOT_PASSWORD: dealer_ci_alphanumeric_password_123
      MONGO_DATABASE: dealer_ci
      JWT_SECRET: ci_only_secret_that_is_long_enough_for_hmac_signing_and_never_used_outside_this_job
      WEB_ORIGIN: http://localhost:5173,dealer://app
      VITE_API_URL: http://localhost:8080
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: CI_Admin_Password_12345
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build and start isolated stack
        run: docker compose up --build -d
      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/health -o /tmp/health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json
          jq -e '.status == "ok" and .database == "connected"' /tmp/health.json
      - name: Exercise complete property and deal workflows
        run: python3 scripts/api_workflow_smoke.py
      - name: Prepare persistent listing fixture
        run: python3 scripts/persistence_smoke.py prepare
      - name: Restart API without restarting MongoDB
        run: |
          set -euo pipefail
          docker compose restart api
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/health -o /tmp/health-after-restart.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health-after-restart.json
          jq -e '.status == "ok" and .database == "connected"' /tmp/health-after-restart.json
      - name: Verify persisted listing after API restart
        run: python3 scripts/persistence_smoke.py verify
      - name: Collect container logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=250 mongo api frontend || true
      - name: Remove isolated stack and test data
        if: always()
        run: docker compose down -v
